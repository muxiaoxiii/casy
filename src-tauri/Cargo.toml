[package]
name = "casy"
version = "0.1.0"
description = "Casy - 跨端案件管理系统"
authors = ["only"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "casy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
rust_xlsxwriter = "0.80"
calamine = "0.26"
zip = "0.6"
base64 = "0.22"
csv = "1"
sha2 = "0.10"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
nom = "7"

# 文件系统监听
notify = "7"

# 邮件
mailparse = "0.15"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
futures-util = "0.3"

# AI 后端
async-trait = "0.1"
# llama-cpp-2 = "0.1" # OvisOCR2 推理 (Phase 3) - Requires cmake to build
# pdfium-render = "0.8" # PDF 转图片 (Phase 3)

# OCR（可选）

# 系统回收站
trash = "5"

# OS Keychain
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
getrandom = "0.2"
hex = "0.4"

# 截屏捕获
screenshots = "0.6"

# 剪贴板监听
arboard = "3"
specta = { version = "1.0.5", features = ["export"] }
pdf-extract = "0.12.0"
lopdf = "0.36.0"
docx-rs = "0.4.22"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
