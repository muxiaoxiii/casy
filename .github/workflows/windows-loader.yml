name: Windows loader diagnosis
on:
  push:
    branches: [codex/casy-0.1.3-production-validation]
    paths: ['scripts/diagnose-windows-loader.py', '.github/workflows/windows-loader.yml', 'src-tauri/build.rs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
            tools/casy-doc-engine
      - uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/casy-renderer
            ${{ runner.temp }}/casy-vcpkg/installed
          key: windows-renderer-${{ hashFiles('scripts/prepare-windows-renderer.ps1') }}
          fail-on-cache-miss: true
      - shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "OPENSSL_DIR=$env:RUNNER_TEMP/casy-vcpkg/installed/x64-windows-static-md"
          Add-Content $env:GITHUB_ENV 'OPENSSL_STATIC=1'
          Add-Content $env:GITHUB_PATH "$pwd/src-tauri/runtime/zvec"
      - run: npm ci
      - run: npm run build
      - run: node scripts/prepare-zvec.mjs
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
      - run: python scripts/diagnose-windows-loader.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-loader-report
          path: outputs/release-loader
