# R-3 CI 流水线（B4）
#
# 结构：
#   frontend  —— typecheck + vite build（每次 push/PR）
#   rust      —— cargo test 三平台矩阵 + bindings 漂移校验（ubuntu 承担）
#   tauri-build —— 仅 v* tag 触发，三平台完整打包并上传 **草稿 Release**
#
# Windows uses the same pinned renderer/OpenSSL preparation as beta packaging.
# Common Controls v6 is embedded by build.rs; loader checks remain a hard gate.

name: CI

on:
  push:
    branches: [main, codex/casy-0.1.3-production-validation]
    tags: ['v*', '!v*-beta.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node --test scripts/*.test.mjs
      - run: npm run build
      # rust 作业编译期 generate_context! 需要该目录存在（tauri.conf frontendDist=../dist）
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  rust:
    needs: [frontend]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 Linux 系统依赖（GTK/WebKit 等，tauri 官方 prerequisite 清单）
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        id: renderer-cache
        with:
          path: |
            ${{ runner.temp }}/casy-renderer
            ${{ runner.temp }}/casy-vcpkg/installed
          key: windows-renderer-${{ hashFiles('scripts/prepare-windows-renderer.ps1') }}
      - if: runner.os == 'Windows' && steps.renderer-cache.outputs.cache-hit != 'true'
        name: Build pinned Windows renderer and static OpenSSL
        shell: pwsh
        run: ../scripts/prepare-windows-renderer.ps1
      - if: runner.os == 'Windows' && steps.renderer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/casy-renderer
            ${{ runner.temp }}/casy-vcpkg/installed
          key: ${{ steps.renderer-cache.outputs.cache-primary-key }}
      - if: runner.os == 'Windows'
        name: Set native runtime paths
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "OPENSSL_DIR=$env:RUNNER_TEMP/casy-vcpkg/installed/x64-windows-static-md"
          Add-Content $env:GITHUB_ENV 'OPENSSL_STATIC=1'
          Add-Content $env:GITHUB_ENV "CASY_RENDERER_DISTRIBUTION=$env:RUNNER_TEMP/casy-renderer"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node ../scripts/prepare-zvec.mjs
      - run: node ../scripts/prepare-fonts.mjs
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$pwd/runtime/zvec"
      - if: runner.os == 'Windows'
        run: cargo test --locked --tests --no-run
      - if: runner.os == 'Windows'
        working-directory: .
        run: python scripts/diagnose-windows-loader.py
      - run: cargo test --locked
        env:
          CASY_TEST_DATA_DIR: ${{ runner.temp }}/casy-ci-tests
      - run: cargo test --manifest-path ../tools/casy-doc-engine/Cargo.toml --locked --features models
      # 审计#6：Clippy 零警告门禁 + 依赖漏洞审计
      - if: runner.os == 'Linux'
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo install cargo-audit --locked || true
          cargo audit
      # bindings 漂移校验（D-3）：生成物过期 = 失败
      - if: runner.os == 'Linux'
        run: |
          cargo test export_bindings
          git diff --exit-code -- ../src/types/bindings.ts
        env:
          CASY_TEST_DATA_DIR: ${{ runner.temp }}/casy-ci-tests

  # Only package the platform with a complete verified OCR renderer distribution.
  # Linux/Windows packaging resumes after their runtime distributions are supplied.
  tauri-build:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-beta.')
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: 'release/*'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install -y strawberryperl nasm
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static-md
          Add-Content $env:GITHUB_ENV "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
      - run: npm ci
      - run: brew install poppler
      # Windows 打包前置同文件头注释；未签名产物仅供内测草稿
      - run: npm run release:validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-validation-evidence
          path: outputs/release-*
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.bundles }}
