name: Beta desktop packages
on:
  push:
    branches: [codex/casy-0.1.3-production-validation]
    tags: ['v*-beta.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check beta version and tag
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const v=JSON.parse(fs.readFileSync("package.json")).version; assert.match(v,/^\d+\.\d+\.\d+-beta\.\d+$/); assert.equal(JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")).version,v); if(process.env.GITHUB_REF_TYPE==="tag") assert.equal(process.env.GITHUB_REF_NAME,"v"+v)'
      - run: npm run test:unit -- --maxWorkers=2
      - run: node --test scripts/*.test.mjs
      - run: npm run build
  package:
    needs: frontend
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macOS-arm64
          - os: windows-2025
            platform: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
            tools/casy-doc-engine
      - run: npm ci
      - if: runner.os == 'macOS'
        run: brew install poppler
      - if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        id: renderer-cache
        with:
          path: |
            ${{ runner.temp }}/casy-renderer
            ${{ runner.temp }}/casy-vcpkg/installed
          key: windows-renderer-${{ hashFiles('scripts/prepare-windows-renderer.ps1') }}
      - if: runner.os == 'Windows' && steps.renderer-cache.outputs.cache-hit != 'true'
        name: Build pinned Windows renderer and static OpenSSL
        shell: pwsh
        run: ./scripts/prepare-windows-renderer.ps1
      - if: runner.os == 'Windows' && steps.renderer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/casy-renderer
            ${{ runner.temp }}/casy-vcpkg/installed
          key: ${{ steps.renderer-cache.outputs.cache-primary-key }}
      - if: runner.os == 'Windows'
        name: Set native runtime paths
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_ENV "OPENSSL_DIR=$env:RUNNER_TEMP/casy-vcpkg/installed/x64-windows-static-md"
          Add-Content $env:GITHUB_ENV 'OPENSSL_STATIC=1'
          Add-Content $env:GITHUB_ENV "CASY_RENDERER_DISTRIBUTION=$env:RUNNER_TEMP/casy-renderer"
      - run: node scripts/prepare-zvec.mjs
      - run: node scripts/prepare-fonts.mjs
      - if: runner.os == 'Windows'
        name: Make Zvec available to test binaries
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "$pwd/src-tauri/runtime/zvec"
      - run: npm run build
      - if: runner.os == 'Windows'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --tests --no-run
      - if: runner.os == 'Windows'
        run: python scripts/diagnose-windows-loader.py
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --tests
        env:
          CASY_TEST_DATA_DIR: ${{ runner.temp }}/casy-beta-tests
      - run: cargo test --locked --manifest-path tools/casy-doc-engine/Cargo.toml --features models
      - if: runner.os == 'macOS'
        run: npm run release:validation
      - if: runner.os == 'Windows'
        run: npm run build:desktop -- --config src-tauri/tauri.windows-beta.conf.json --bundles nsis
      - if: runner.os == 'Windows'
        run: node scripts/package-windows-beta.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.platform }}
          path: outputs/release-*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: beta-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Casy ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          body_path: docs/releases/0.1.3-beta.1.md
          files: release/*
          fail_on_unmatched_files: true
