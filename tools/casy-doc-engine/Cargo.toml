[package]
name = "casy-doc-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[features]
default = []
models = ["dep:oar-ocr", "dep:ort", "dep:tokenizers"]

[dependencies]
anyhow = "1"
harumi = { version = "1.19.0", features = ["image"] }
pdf-extract = "0.12"
hex = "0.4"
image = "0.25"
tiff = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
oar-ocr = { version = "0.9.2", optional = true }
ort = { version = "=2.0.0-rc.13", optional = true }
tokenizers = { version = "0.23.1", optional = true }
